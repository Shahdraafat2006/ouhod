<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موافقة الطرفين</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="container nav">
    <a class="brand" href="index.html">♡ عهود ومواثيق</a>
    <a href="dashboard.html" class="btn btn-outline btn-sm">
      لوحة التحكم
    </a>
  </div>
</header>

<main class="page-wrap">

<div class="container" style="max-width:760px">

  <h1 class="page-title">مراجعة وموافقة الطرفين</h1>

  <p class="subtext">
    تأكد من أن النسخة المعروضة هي النسخة التي قرأها الطرفان.
  </p>

  <div class="panel">

    <h3 style="color:#79545e">ملخص الميثاق المحدد</h3>

    <div id="approvalSummary" class="empty">
      افتح هذه الصفحة من رابط الميثاق لإظهار ملخصه.
    </div>

    <div class="notice">
      الموافقة هنا تجريبية فقط.
      لا يوجد تحقق من هوية الموافق أو تسجيل توقيع إلكتروني معتمد.
    </div>

    <label style="display:flex;gap:10px;align-items:flex-start;margin:15px 0">

      <input type="checkbox" id="readConfirm">

      أقر بأنني قرأت البنود المعروضة وأفهم أنها نسخة تجريبية.

    </label>

    <button id="approvalDemo" class="btn btn-primary">
      تسجيل موافقة تجريبية
    </button>

  </div>

</div>

</main>

<script src="js/app.js"></script>

</body>
</html>
