
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="container nav">
    <a class="brand" href="index.html">♡ عهود ومواثيق</a>
    <a href="dashboard.html" class="btn btn-outline btn-sm">
      لوحة التحكم
    </a>
  </div>
</header>

<main class="page-wrap">

<div class="container" style="max-width:760px">

  <h1 class="page-title">الملف الشخصي</h1>

  <p class="subtext">
    بيانات الحساب التجريبي الحالي.
  </p>

  <div class="panel">

    <div class="avatar"
      style="width:60px;height:60px;font-size:25px;margin-bottom:15px">
      ♡
    </div>

    <h3 data-user-name style="color:#79545e">
      زائر
    </h3>

    <p style="color:var(--muted)">
      يمكنك تسجيل الدخول أو إنشاء حساب لتجربة عرض الاسم في لوحة التحكم.
    </p>

    <div class="form-actions">

      <a href="login.html" class="btn btn-primary">
        تسجيل الدخول
      </a>

      <a href="register.html" class="btn btn-outline">
        إنشاء حساب
      </a>

      <button class="btn btn-danger" data-logout>
        تسجيل الخروج
      </button>

    </div>

    <div class="notice">
      هذه صفحة واجهة فقط.
      لا يوجد حساب مستخدم حقيقي أو تخزين آمن للملفات الشخصية.
    </div>

  </div>

</div>

</main>

<script src="js/app.js"></script>

</body>
</html>
